# ===================================================================
# Employee Payroll Management System - Application Configuration
# ===================================================================

server.port=8080
server.servlet.context-path=/

# -------------------------------------------------------------------
# Database Configuration
# Default: High-Performance Embedded Database (MySQL-compatible mode)
# Ready out-of-the-box with ZERO installation required.
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:payroll_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER,MONTH,YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------------
# To switch to an external MySQL 8.x instance:
# 1. Comment out the 4 lines above
# 2. Uncomment the 4 lines below:
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/payroll_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.sql.init.mode=never
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# Static Resources Configuration
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Logging
logging.level.com.payroll=INFO
logging.level.org.springframework.security=WARN
